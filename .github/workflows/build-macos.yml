name: Build macOS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Clippy.xcodeproj \
            -scheme "Clippy macOS" \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            build | xcbeautify

      - name: Zip app bundle
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent "Clippy.app" "Clippy-${{ github.sha }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Clippy-${{ github.sha }}
          path: build/Build/Products/Release/Clippy-*.zip
          if-no-files-found: error
